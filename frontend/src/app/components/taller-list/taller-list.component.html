<div class="list-container">
  <div class="institutional-header">
    <div class="header-content">
      <div class="header-icon">🏭</div>
      <div class="header-text">
        <h1>Mis Talleres</h1>
        <p class="header-subtitle">Sistema de Gestión de Talleres</p>
      </div>
    </div>
  </div>

  <div *ngIf="loading" class="loading">
    <div class="loading-spinner"></div>
    <p>Cargando talleres...</p>
  </div>

  <div *ngIf="error" class="error">
    {{ error }}
  </div>

  <div *ngIf="!loading && !error">
    <div *ngIf="talleres.length === 0" class="empty-state">
      <div class="empty-icon">🏭</div>
      <h2>No hay talleres registrados</h2>
      <p>Comienza agregando tu primer taller</p>
      <button class="btn btn-primary empty-btn" (click)="onCreateNew()">
        + Agregar Primer Taller
      </button>
    </div>

    <div *ngIf="talleres.length > 0" class="talleres-list">
      <app-taller-item
        *ngFor="let taller of talleres"
        [taller]="taller"
        (onEdit)="onEdit($event)"
        (onDelete)="onDelete($event)"
      ></app-taller-item>
    </div>
  </div>

  <!-- Floating Action Button (FAB) -->
  <button class="fab" (click)="onCreateNew()" title="Agregar Nuevo Taller">
    <span class="fab-icon">+</span>
  </button>
</div>
