<article class="list-group-item">
  <div class="d-flex align-items-center gap-2">
    <button
      type="button"
      class="btn btn-link workshop-toggle text-decoration-none p-0 flex-grow-1 text-start d-flex align-items-center gap-3"
      (click)="toggleExpand()"
      [attr.aria-expanded]="expanded"
      [attr.aria-label]="(expanded ? 'Contraer ' : 'Desplegar ') + taller.propietario"
    >
      <span class="editorial-section-label" aria-hidden="true">{{ expanded ? '−' : '+' }}</span>
      <span class="fw-semibold fs-4 text-truncate">{{ taller.propietario }}</span>
    </button>

    <button
      type="button"
      class="btn btn-outline-secondary btn-sm editorial-icon-button"
      (click)="openGoogleMaps()"
      title="Ver en Google Maps"
      aria-label="Ver ubicación en Google Maps"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="20"
        height="20"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
        <circle cx="12" cy="10" r="3"></circle>
      </svg>
    </button>
  </div>

  <div *ngIf="expanded" class="border-top mt-3 pt-3 ms-md-4">
    <div class="mb-3">
      <div class="small text-body-secondary fw-semibold text-uppercase">Dirección</div>
      <div class="editorial-detail-value text-break">{{ taller.direccion }}</div>
    </div>

    <div *ngIf="taller.telefono && taller.telefono.trim()" class="mb-3">
      <div class="small text-body-secondary fw-semibold text-uppercase">Teléfono</div>
      <div class="editorial-detail-value">{{ taller.telefono }}</div>
    </div>

    <div class="d-flex justify-content-end gap-2">
      <button
        type="button"
        class="btn btn-outline-secondary btn-sm editorial-icon-button"
        (click)="editTaller()"
        title="Editar taller"
        aria-label="Editar taller"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="20"
          height="20"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
          <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
        </svg>
      </button>

      <button
        type="button"
        class="btn btn-outline-secondary btn-sm editorial-icon-button"
        (click)="deleteTaller()"
        title="Eliminar taller"
        aria-label="Eliminar taller"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="20"
          height="20"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <polyline points="3 6 5 6 21 6"></polyline>
          <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
        </svg>
      </button>
    </div>
  </div>
</article>
