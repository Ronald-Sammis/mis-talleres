<main class="container py-4">
  <div class="row justify-content-center">
    <div class="col-12 col-md-10 col-lg-8 col-xl-6">
      <section class="card shadow-sm">
        <div class="card-header d-flex align-items-center gap-3">
          <div class="rounded-3 bg-primary-subtle text-primary-emphasis p-2">
            <svg viewBox="0 0 64 64" width="40" height="40" aria-hidden="true">
              <path fill="currentColor" d="M7 5 25 13c4-2 10-2 14 0l18-8-4 23c-2 13-10 22-21 29-11-7-19-16-21-29L7 5Z" />
            </svg>
          </div>
          <div>
            <h1 class="h3 mb-1">{{ isEditMode ? 'Editar Taller' : 'Nuevo Taller' }}</h1>
            <p class="text-body-secondary mb-0">{{ isEditMode ? 'Actualiza la información del taller' : 'Agrega un taller a tu lista' }}</p>
          </div>
        </div>

        <div class="card-body">
          <form [formGroup]="tallerForm" (ngSubmit)="onSubmit()">
            <div class="mb-3">
              <label for="propietario" class="form-label">Propietario <span class="text-danger">*</span></label>
              <input
                type="text"
                id="propietario"
                formControlName="propietario"
                class="form-control"
                placeholder="Nombre del propietario"
                [class.is-invalid]="submitted && f['propietario'].errors"
              />
              <div *ngIf="submitted && f['propietario'].errors" class="invalid-feedback d-block">
                El propietario es obligatorio
              </div>
            </div>

            <div class="mb-3">
              <label for="telefono" class="form-label">Teléfono</label>
              <input
                type="tel"
                id="telefono"
                formControlName="telefono"
                class="form-control"
                placeholder="Número de teléfono"
              />
            </div>

            <div class="mb-3">
              <label for="direccion" class="form-label">Dirección <span class="text-danger">*</span></label>
              <input
                type="text"
                id="direccion"
                formControlName="direccion"
                class="form-control"
                placeholder="Dirección del taller"
                [class.is-invalid]="submitted && f['direccion'].errors"
              />
              <div *ngIf="submitted && f['direccion'].errors" class="invalid-feedback d-block">
                La dirección es obligatoria
              </div>
            </div>

            <div class="mb-3">
              <label for="linkGoogleMaps" class="form-label">Link de Google Maps <span class="text-danger">*</span></label>
              <input
                type="url"
                id="linkGoogleMaps"
                formControlName="linkGoogleMaps"
                class="form-control"
                placeholder="https://maps.google.com/..."
                [class.is-invalid]="submitted && f['linkGoogleMaps'].errors"
              />
              <div *ngIf="submitted && f['linkGoogleMaps'].errors" class="invalid-feedback d-block">
                <div *ngIf="f['linkGoogleMaps'].errors['required']">El link es obligatorio</div>
                <div *ngIf="f['linkGoogleMaps'].errors['pattern']">El link debe ser una URL válida (http o https)</div>
              </div>
            </div>

            <div class="d-flex flex-column flex-sm-row gap-2 mt-4">
              <button type="submit" class="btn btn-primary flex-fill" [disabled]="submitted && tallerForm.invalid">
                <span class="me-1" aria-hidden="true">{{ isEditMode ? '✏️' : '➕' }}</span>
                {{ isEditMode ? 'Actualizar' : 'Crear' }}
              </button>
              <button type="button" class="btn btn-outline-secondary flex-fill" (click)="onCancel()">
                <span class="me-1" aria-hidden="true">✕</span>
                Cancelar
              </button>
            </div>
          </form>
        </div>
      </section>
    </div>
  </div>
</main>
