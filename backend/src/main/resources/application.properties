# Configuración PostgreSQL - Desarrollo local (puede ser sobrescrito por variables de entorno)
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/mistalleres}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:MyPostgre_1234567}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:true}

# Puerto del servidor - Render asigna puerto automáticamente via variable PORT
server.port=${PORT:8080}
